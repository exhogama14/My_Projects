[package]
name = "rust_server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_urlencoded = "0.7"
chrono = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
dirs = "5.0"
uuid = { version = "1.0", features = ["v4"] }
